name: Deploy EasyMARL Documentation (Simple)

on:
  push:
    branches: [ main, master ]

# Concurrency group to prevent multiple deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

# Add permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js (Simple)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Debug directory structure
      run: |
        echo "📁 Repository structure:"
        ls -la
        echo ""
        echo "📁 docs-website directory:"
        ls -la docs-website/
        
    - name: Install dependencies (Simple)
      run: |
        cd docs-website
        echo "📦 Installing dependencies..."
        npm install
        echo "✅ Dependencies installed"

    - name: Build site (Simple)
      run: |
        cd docs-website
        echo "🔨 Building documentation site..."
        PUBLIC_URL="/EasyMARL" npm run build
        echo "✅ Build completed"
        ls -la build/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs-website/build'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
