name: Complete Deployment Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target'
        required: true
        default: 'github-pages'
        type: choice
        options:
        - github-pages
        - pypi
        - codespaces-test

jobs:
  # Job 1: Test Codespaces Configuration
  test-codespaces:
    if: contains(github.event.inputs.deploy_target, 'codespaces') || github.event.inputs.deploy_target == ''
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate devcontainer configuration
      run: |
        echo "🔍 Testing Codespaces configuration..."
        if [ -f .devcontainer/devcontainer.json ]; then
          cat .devcontainer/devcontainer.json | jq . > /dev/null
          echo "✅ devcontainer.json is valid"
        fi
        
        if [ -f .devcontainer/setup.sh ]; then
          echo "✅ setup.sh exists"
        fi
        
        echo "🎓 Codespaces ready for students!"

  # Job 2: Build and Deploy React Frontend to GitHub Pages  
  deploy-github-pages:
    if: contains(github.event.inputs.deploy_target, 'github-pages') || github.event.inputs.deploy_target == '' 
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'gui/react-frontend/package-lock.json'
        
    - name: Install React dependencies
      run: |
        cd gui/react-frontend
        npm ci
        
    - name: Build React app
      run: |
        cd gui/react-frontend
        npm run build
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gui/react-frontend/build
        cname: shreyanmitra.github.io
        
    - name: Deployment summary
      run: |
        echo "✅ React frontend deployed to GitHub Pages"
        echo "🌐 Frontend URL: https://shreyanmitra.github.io/EasyMARL"

  # Job 3: Publish Python Package to PyPI
  deploy-pypi:
    if: contains(github.event.inputs.deploy_target, 'pypi') || (startsWith(github.ref, 'refs/tags/v') && github.event.inputs.deploy_target == '')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel setuptools
        
    - name: Build package
      run: python -m build
      
    - name: Check package
      run: |
        twine check dist/*
        ls -la dist/
        
    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/v')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        
    - name: Publish to Test PyPI
      if: "!startsWith(github.ref, 'refs/tags/v')"
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository_url: https://test.pypi.org/legacy/
        
    - name: Package summary
      run: |
        echo "✅ Python package published"
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          echo "📦 Published to PyPI: pip install easymarl"
        else
          echo "📦 Published to Test PyPI for testing"
        fi

  # Job 4: Deployment Summary
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [test-codespaces, deploy-github-pages, deploy-pypi]
    if: always()
    
    steps:
    - name: Deployment Summary
      run: |
        echo "🚀 EasyMARL Deployment Pipeline Complete!"
        echo ""
        echo "📊 Deployment Status:"
        echo "  • Codespaces (Development): ${{ needs.test-codespaces.result }}"
        echo "  • GitHub Pages (Frontend): ${{ needs.deploy-github-pages.result }}"
        echo "  • PyPI (Python Package): ${{ needs.deploy-pypi.result }}"
        echo ""
        echo "🌐 Access Points:"
        echo "  • 🎓 Codespaces: https://codespaces.new/shreyanmitra/EasyMARL"
        echo "  • 📱 Frontend: https://shreyanmitra.github.io/EasyMARL"
        echo "  • 📦 Package: pip install easymarl"
        echo "  • 🔧 CLI: easymarl-train, easymarl-gui, easymarl-demo"
