name: Deploy EasyMARL Documentation (Disabled)

on:
  # Temporarily disabled - using deploy-simple.yml instead
  workflow_dispatch:

# Concurrency group to prevent multiple deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

# Add permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      working-directory: docs-website
      run: |
        echo "📦 Installing documentation site dependencies..."
        echo "📁 Current directory contents:"
        ls -la
        # Use npm with specific flags for GitHub Actions  
        npm install --prefer-offline --no-audit --progress=false
        echo "✅ Dependencies installed successfully"

    - name: Build documentation site
      working-directory: docs-website
      run: |
        echo "🔨 Building documentation site..."
        # Set environment variables for GitHub Pages
        export PUBLIC_URL="/EasyMARL"
        export CI=false
        export GENERATE_SOURCEMAP=false
        npm run build
        echo "✅ Build completed successfully"
        echo "📁 Build directory contents:"
        ls -la build/
        # Verify critical files exist
        if [ ! -f "build/index.html" ]; then
          echo "❌ index.html not found in build directory"
          exit 1
        fi
        echo "✅ Build verification passed"
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs-website/build'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
