# WoLF-PHC (Win or Learn Fast - Policy Hill Climbing) Configuration
algorithm: "wolfphc"

# Training parameters
max_episodes: 1000
max_steps: 100
eval_interval: 50
log_interval: 10

# WoLF-PHC hyperparameters
gamma: 0.99
learning_rate: 0.1

# WoLF parameters
delta_win: 0.001     # Learning rate when winning
delta_lose: 0.01     # Learning rate when losing
exploration_rate: 0.1

# Function approximation
use_function_approximation: false  # Set to true for neural networks

# Buffer parameters (for function approximation)
batch_size: 32
memory_size: 10000
train_start: 1000
update_interval: 1

# Network architecture (if using function approximation)
hidden_dim: 128
activation: "relu"

# Environment configuration
render: false
save_model: true
model_save_interval: 100

# Logging
use_wandb: false
project_name: "EasyMARL-WoLFPHC"
