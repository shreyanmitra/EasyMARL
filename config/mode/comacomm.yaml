# COMA with Communication Configuration  
# COMA-Comm extends COMA with explicit communication channels

# Algorithm specific parameters
algorithm:
  name: "COMAComm"
  
# Learning parameters
actor_lr: 0.0001
critic_lr: 0.001
gamma: 0.99
td_lambda: 0.8
train_start: 1000
critic_update_freq: 1

# Network architecture
hidden_dim: 128

# Communication parameters
communication_dim: 32
comm_history_length: 10

# Training parameters
max_episodes: 1000
max_steps_per_episode: 100
evaluation_interval: 50
save_interval: 100

# Environment parameters
environment:
  name: "MultiGrid-Cluttered-Fixed-15x15"
  render: false

# Logging
use_wandb: false
wandb_project: "easmarl_comacomm"
log_interval: 10
