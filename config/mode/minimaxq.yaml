# Minimax-Q Learning Configuration
# Minimax-Q extends Q-learning for adversarial multi-agent settings

# Algorithm specific parameters
algorithm:
  name: "MinimaxQ"
  
# Learning parameters
learning_rate: 0.001
gamma: 0.99
batch_size: 32
memory_size: 10000
train_start: 1000
update_interval: 1
target_update_freq: 100

# Network architecture
hidden_dim: 128

# Exploration parameters
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay: 0.995

# Opponent modeling
history_length: 1000

# Training parameters
max_episodes: 1000
max_steps_per_episode: 100
evaluation_interval: 50
save_interval: 100

# Environment parameters
environment:
  name: "MultiGrid-Cluttered-Fixed-15x15"
  render: false

# Logging
use_wandb: false
wandb_project: "easmarl_minimaxq"
log_interval: 10
