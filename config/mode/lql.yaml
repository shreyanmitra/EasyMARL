# Lenient Q-Learning (LQL) Configuration
algorithm: "lql"

# Training parameters
max_episodes: 1000
max_steps: 100
eval_interval: 50
log_interval: 10

# LQL hyperparameters
gamma: 0.99
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay: 0.995
learning_rate: 0.1

# Lenient parameters
lenient_rate: 0.8    # Probability of lenient update
temperature: 1.0     # Temperature for lenient selection
min_temp: 0.1        # Minimum temperature
temp_decay: 0.999    # Temperature decay

# Buffer parameters
batch_size: 32
memory_size: 10000
train_start: 1000
update_interval: 1

# Network architecture
hidden_dim: 128
activation: "relu"

# Environment configuration
render: false
save_model: true
model_save_interval: 100

# Logging
use_wandb: false
project_name: "EasyMARL-LQL"
