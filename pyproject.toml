[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easymarl"
version = "1.0.0"
description = "Educational Multi-Agent Reinforcement Learning Framework with 20+ Algorithms"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Shreyan Mitra", email = "shreyan.m.mitra@gmail.com"}
]
maintainers = [
    {name = "Shreyan Mitra", email = "shreyan.m.mitra@gmail.com"}
]
keywords = [
    "multi-agent", 
    "reinforcement-learning", 
    "machine-learning",
    "artificial-intelligence", 
    "education", 
    "research", 
    "marl",
    "q-learning", 
    "policy-gradient", 
    "actor-critic", 
    "cooperative-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "torch>=1.12.0",
    "torchvision>=0.13.0",
    "numpy>=1.21.6",
    "gymnasium>=0.29.0",
    "gym==0.21.0",
    "scipy>=1.9.0", 
    "gym-minigrid==1.0.3",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "pandas>=2.0.3",
    "pillow>=9.0.0",
    "pyyaml>=6.0",
    "configparser>=5.2.0"
]

[project.optional-dependencies]
enhanced = [
    "numba>=0.57.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0", 
    "psutil>=5.9.0",
    "GPUtil>=1.4.0",
    "gymnasium[vector]>=0.29.0"
]
gui = [
    "gradio>=4.0.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0"
]
tracking = [
    "wandb>=0.12.21"
]
video = [
    "moviepy>=1.0.3",
    "ffmpeg>=1.4"
]
optimization = [
    "cvxpy>=1.2.0",
    "networkx>=2.6.0"
]
all = [
    "numba>=0.57.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "psutil>=5.9.0", 
    "GPUtil>=1.4.0",
    "gymnasium[vector]>=0.29.0",
    "gradio>=4.0.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "wandb>=0.12.21",
    "moviepy>=1.0.3",
    "ffmpeg>=1.4",
    "cvxpy>=1.2.0",
    "networkx>=2.6.0"
]

[project.urls]
Homepage = "https://github.com/shreyanmitra/EasyMARL"
Documentation = "https://github.com/shreyanmitra/EasyMARL#readme"
Repository = "https://github.com/shreyanmitra/EasyMARL.git"
"Bug Tracker" = "https://github.com/shreyanmitra/EasyMARL/issues"
Demo = "https://shreyanmitra.github.io/EasyMARL"

[project.scripts]
easymarl-gui = "easymarl.gui:main"
easymarl-train = "easymarl.main:main"
easymarl-demo = "easymarl.examples.demo:main"

[tool.setuptools]
packages = ["easymarl"]
include-package-data = true

[tool.setuptools.package-data]
easymarl = [
    "config/*.yaml",
    "config/**/*.yaml",
    "examples/*.py", 
    "gui.py",
    "react-frontend/build/**/*",
    "react-frontend/public/**/*"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["easymarl*"]
exclude = ["tests*", "docs*"]
